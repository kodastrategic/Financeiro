<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Presença</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rsvp.css">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>

<main class="wrap wrap-list">
  <header class="admin-head">
    <span class="eyebrow">Evento</span>
    <h1>Lista de<br><em>Presença</em></h1>
    <p><span class="count-pill" id="countLabel">Carregando...</span></p>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Buscar nome...">
    <button type="button" class="ghost-btn" id="refreshBtn">Atualizar</button>
  </div>

  <ol class="list" id="list"></ol>
  <p class="empty" id="emptyMsg" hidden>Nenhuma confirmação ainda.</p>
</main>

<script>
(function() {
  'use strict';
  const sb = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

  const $ = (s) => document.getElementById(s);
  const listEl = $('list'), countEl = $('countLabel'),
        emptyEl = $('emptyMsg'), searchEl = $('searchInput');
  let all = [];

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('pt-BR') + ' às ' +
      d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  async function removeRsvp(id, li) {
    li.classList.add('removing');
    try {
      const { error } = await sb.from('rsvps').delete().eq('id', id);
      if (error) throw error;
    } catch (ex) {
      console.error(ex);
      li.classList.remove('removing');
      return;
    }
    setTimeout(() => {
      all = all.filter(x => x.id !== id);
      render();
    }, 240);
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const rows = all.filter(r => !q || r.name.toLowerCase().includes(q));
    listEl.innerHTML = '';
    rows.forEach((r, i) => {
      const li = document.createElement('li');

      const pos = document.createElement('span');
      pos.className = 'pos';
      pos.textContent = String(i + 1).padStart(2, '0');

      const who = document.createElement('div');
      who.className = 'who';
      const strong = document.createElement('strong');
      strong.textContent = r.name;
      const time = document.createElement('time');
      time.textContent = formatDate(r.confirmedat);
      who.append(strong, time);

      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'remove-btn';
      rm.title = 'Remover da lista';
      rm.setAttribute('aria-label', 'Remover ' + r.name);
      rm.textContent = '\u00d7';
      let timer = null;
      rm.addEventListener('click', async () => {
        if (rm.classList.contains('arm')) {
          clearTimeout(timer);
          await removeRsvp(r.id, li);
          return;
        }
        rm.classList.add('arm');
        rm.textContent = 'Confirmar?';
        timer = setTimeout(() => {
          rm.classList.remove('arm');
          rm.textContent = '\u00d7';
        }, 3200);
      });

      li.append(pos, who, rm);
      listEl.appendChild(li);
    });
    emptyEl.hidden = rows.length > 0;
    const n = all.length;
    countEl.textContent = n === 0 ? 'Nenhuma confirmação'
      : n + (n === 1 ? ' confirmação' : ' confirmações');
  }

  async function load() {
    try {
      const { data, error } = await sb.from('rsvps')
        .select('*').order('id', { ascending: false });
      if (error) throw error;
      all = data || [];
    } catch (ex) {
      console.error(ex);
      countEl.textContent = 'Erro ao carregar';
    }
    render();
  }

  searchEl.addEventListener('input', render);
  $('refreshBtn').addEventListener('click', load);
  setInterval(load, 30000);
  load();
})();
</script>
</body>
</html>
